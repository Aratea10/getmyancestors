name: Complete family traversal tests

on:
  push:
    branches:
      - feat/complete-family-traversal
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Check syntax
        run: python -m compileall -q getmyancestors tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
